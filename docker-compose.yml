version: '3.8'

# CivicAI Lampung - Container Infrastructure
# Copyright©2026 by Putri Cahyani dan Dr. Erliyan Redy Susanto, M.Kom

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: civicai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-civicai_lampung}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicai-backend
    restart: always
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/civicai_lampung
      JWT_SECRET: ${JWT_SECRET:-civicai-lampung-secret-key-2026}
      UPLOAD_DIR: /app/storage/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage/uploads:/app/storage/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicai-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

